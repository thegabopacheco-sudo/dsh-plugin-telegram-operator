# dsh-plugin-telegram-operator — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "telegram".
# Tools resultantes: mcp__telegram__* (ver README).
- insert:
    - id: mcp-telegram-operator
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: telegram
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/telegram-operator/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
